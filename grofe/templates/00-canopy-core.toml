requires = "grofe >= 0.1"

# canopy's core defaults, on grofe. The tmux layer this ports is
# tmux/conf.d/00-core.conf, and every value here is that file's, with the
# reasoning left there rather than copied. Where grofe differs, the line
# says why.
#
# No duplicate-append guard. On tmux the terminal block appended to list
# options, so a reload appended a second time and 00-core wrapped it in a
# %if on @canopy_core_appended. A TOML array sets the whole list, and grofe's
# `reload` re-reads every layer from scratch, so there is nothing to guard.

# C-s rather than C-b: see 00-core.conf. `prefix C-s` sends it through,
# which is the prefix-send row in the key table.
prefix = "C-s"

base-index = 1
pane-base-index = 1
focus-events = true
history-limit = 100000
mouse = true
renumber-windows = true
set-clipboard = "on"
mode-keys = "vi"

# Not set: escape-time. canopy sets 0 on tmux; grofe keeps its own 25 ms
# default, so a lone ESC still reaches the program over ssh (grofe's spec,
# section 5.3).

# --- terminal ---------------------------------------------------------------

default-terminal = "tmux-256color"
allow-passthrough = "on"
extended-keys = "always"

# tmux's own entries first, as `set -as` left them, then canopy's.
terminal-features = [
  "xterm*:clipboard:ccolour:cstyle:focus:title",
  "screen*:title",
  "rxvt*:ignorefkeys",
  ",xterm-256color:RGB",
  ",ghostty:RGB",
  ",xterm-ghostty:RGB",
  "xterm*:extkeys",
]
update-environment = [
  "DISPLAY",
  "KRB5CCNAME",
  "MSYSTEM",
  "SSH_ASKPASS",
  "SSH_AUTH_SOCK",
  "SSH_AGENT_PID",
  "SSH_CONNECTION",
  "WAYLAND_DISPLAY",
  "WINDOWID",
  "XAUTHORITY",
  "XDG_CURRENT_DESKTOP",
  "XDG_SESSION_DESKTOP",
  "XDG_SESSION_TYPE",
  "TERM",
  "TERM_PROGRAM",
]

# --- windows ----------------------------------------------------------------

automatic-rename = true
automatic-rename-format = "#{b:pane_current_path}"
allow-rename = false

[user-options]
# The probe that proves the core layer loaded and that user.toml wins over it.
canopy_test_marker = "shipped-default"

[keys.prefix]
# tmux's C-b send-prefix goes with the old prefix; the key table binds C-s.
C-b = ""
