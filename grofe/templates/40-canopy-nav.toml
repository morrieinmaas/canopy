requires = "grofe >= 0.1"

# vim-tmux-navigator, on grofe: C-h, C-j, C-k and C-l move between panes and
# Neovim's windows alike, and C-\ goes to the last pane.
#
# On tmux the plugin binds each key to an if-shell whose condition forks
# `ps -o state= -o comm= -t <tty> | grep` on every keypress. Here each key is
# grofe's format conditional, which reads the pane's foreground process from
# grofe's own sample and forks nothing:
#
#   - When the foreground process is Neovim, Vim or fzf, the key is sent to
#     it. Neovim's half of the plugin then moves between its own windows,
#     and at its edge calls `tmux -S <socket> select-pane -t $TMUX_PANE -L`,
#     which grofe answers as tmux.
#   - Otherwise the key moves focus, as select-pane does.
#
# The match is the plugin's own default pattern, applied to argv[0] of
# #{pane_current_argv} rather than to the process name. A wrapper that execs
# the editor under another file name, as Nix's .nvim-wrapped does, still
# shows `nvim` there. Only argv[0] is tested, so `man vim` is not a match.
# grofe's regex is case-insensitive here, as the plugin's `grep -i` is.
#
# While the window is zoomed, select-pane unzooms it and moves, as it does
# with the plugin on tmux. Setting the plugin's own option
# @tmux_navigator_disable_when_zoomed to 1 (in user.toml's [user-options])
# keeps the focus where it is instead. It is read at each keypress.
#
# The plugin's other options (@vim_navigator_mapping_*, @vim_navigator_pattern
# and @vim_navigator_check) choose the keys and the check when it loads. They
# are not read here: the keys and the pattern are the plugin's defaults. Its
# copy-mode-vi bindings wait for grofe's copy mode (M5).

[keys.root]
C-h = { cmd = "if-shell -F '#{m/ri:^([^ ]+/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?( |$),#{pane_current_argv}}' 'send-keys C-h' \"if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -L'\"", desc = "Focus the pane or Neovim window to the left", group = "pane", name = "nav-left" }
C-j = { cmd = "if-shell -F '#{m/ri:^([^ ]+/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?( |$),#{pane_current_argv}}' 'send-keys C-j' \"if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -D'\"", desc = "Focus the pane or Neovim window below", group = "pane", name = "nav-down" }
C-k = { cmd = "if-shell -F '#{m/ri:^([^ ]+/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?( |$),#{pane_current_argv}}' 'send-keys C-k' \"if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -U'\"", desc = "Focus the pane or Neovim window above", group = "pane", name = "nav-up" }
C-l = { cmd = "if-shell -F '#{m/ri:^([^ ]+/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?( |$),#{pane_current_argv}}' 'send-keys C-l' \"if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -R'\"", desc = "Focus the pane or Neovim window to the right", group = "pane", name = "nav-right" }
"C-\\" = { cmd = "if-shell -F '#{m/ri:^([^ ]+/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?( |$),#{pane_current_argv}}' 'send-keys C-\\' \"if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -l'\"", desc = "Focus the last pane, or Neovim's previous window", group = "pane", name = "nav-last" }

# C-l no longer reaches a shell, so the plugin gives clearing the screen to
# the prefix.
[keys.prefix]
C-l = { cmd = "send-keys C-l", desc = "Clear the screen, which C-l alone no longer does", group = "pane", name = "nav-clear-screen" }
