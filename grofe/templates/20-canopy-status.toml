requires = "grofe >= 0.1"

# canopy's status line, on grofe. The tmux layer this ports is
# tmux/conf.d/20-status.conf: two rows at the top, pills, and every colour
# read from an @theme_* option, so a theme repaints the bar by setting
# options and nothing re-sources anything.
#
# The right-hand segments come from one status source, canopy-status, whose
# last line of output grofe keeps in @canopy-status and redraws on change.
# On tmux that was a #() job; the aggregator is the same script either way.
# The rule it exists for still holds: one process per interval, not one per
# segment.
#
# Load order does not have to protect continuum's autosave here. On tmux,
# continuum prepends its hook to whatever status-right holds when it loads,
# so this layer had to run before the plugin layer. On grofe the plugins
# load as load commands, after every layer is applied, so continuum
# prepends its hook to the final status-right, this one's or user.toml's.

# Colour is data. The defaults are a light palette; a theme overwrites them
# at runtime with `set -g @theme_*`, which wins over this layer and survives
# a reload.
[user-options]
theme_bg = "#fbf1c7"
theme_fg = "#3c3836"
theme_blue = "#458588"
theme_yellow = "#b57614"
theme_green = "#79740e"
theme_grey = "#a89984"
theme_muted = "#7c6f64"
# Not repainted by a theme: see 20-status.conf.
theme_red = "#cc241d"

# The rounded caps, U+E0B6 and U+E0B4, as literal bytes. A machine without a
# nerd font sets both to "" in user.toml, and every segment renders as plain
# text with no caps.
pill_l = ""
pill_r = ""

# Read by the aggregator. Unset means on.
canopy_status_battery = "on"
canopy_status_net = "on"

[status]
# Two rows: the pills on top, an empty second row beneath them. Row 0 empty
# is the built-in row (status-left, the window list, status-right).
lines = 2
rows = ["", ""]
position = "top"
justify = "left"
interval = 5
style = "bg=default,fg=#{@theme_fg}"

left-length = 40
left = "#[fg=#{@theme_blue},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_blue},bold] #{session_name} #[fg=#{@theme_blue},bg=default,nobold]#{@pill_r} "

right-length = 120
right = "#{@canopy-status}"

# The directory's name rather than the window's, matching what 00-core's
# automatic-rename-format puts there.
[status.window]
separator = ""
format = "#[fg=#{@theme_grey},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_grey}] #{window_index} #{window_name} #[fg=#{@theme_grey},bg=default]#{@pill_r} "
current-format = "#[fg=#{@theme_yellow},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_yellow},bold] #{window_index} #{window_name}#{?window_zoomed_flag, +,} #[fg=#{@theme_yellow},bg=default,nobold]#{@pill_r} "

# $CANOPY_STORE is expanded by the source's shell, from the server's global
# environment. The entry point (config.toml) sets it in [environment].
[status.sources.canopy-status]
cmd = "$CANOPY_STORE/bin/canopy-status"
