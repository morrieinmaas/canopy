requires = "grofe >= 0.1"

# Settings that depend on what the running grofe can do.
#
# On tmux these sit behind a %if on #{version} inside 00-core.conf, because
# an option tmux does not know is an error that stops the whole layer. grofe
# has no %if. It skips a whole fragment whose `requires` header it does not
# meet, with a warning, so a setting that needs a newer grofe goes in a file
# of its own with that header, and an older grofe loads everything else.
#
# The tool probe (@canopy_has_<tool>, @canopy_tmux_version) is not here. No
# layer reads it: it is a per-machine fact for `canopy doctor`, which reads
# it from $CANOPY_STATE/05-caps.conf, written by `canopy caps`.

# tmux 3.5 and later on tmux; every grofe has it.
extended-keys-format = "csi-u"
