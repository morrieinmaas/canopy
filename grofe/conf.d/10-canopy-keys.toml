# Generated by `canopy grofe generate` from grofe/templates/10-canopy-keys.toml.
# Do not edit: edit the template, or tmux/keys.tsv, and regenerate.

requires = "grofe >= 0.1"

# canopy's key table, on grofe. Every row comes from tmux/keys.tsv, the one
# declaration of every binding canopy ships, and carries the row's name,
# group and description, so grofe's list-keys and any palette read them.
# grofe/keys.tsv names the rows whose grofe command differs, each with its
# reason.

[keys.prefix]
C-s = { cmd = "send-prefix", desc = "Send the prefix through to a nested tmux or an app that wants it", group = "prefix", name = "prefix-send" }
"|" = { cmd = 'split-window -h -c "#{pane_current_path}"', desc = "Split to the right, in the directory this pane is in", group = "pane", name = "split-right" }
- = { cmd = 'split-window -v -c "#{pane_current_path}"', desc = "Split below, in the directory this pane is in", group = "pane", name = "split-down" }
h = { cmd = "select-pane -L", desc = "Focus the pane to the left", group = "pane", name = "pane-left" }
j = { cmd = "select-pane -D", desc = "Focus the pane below", group = "pane", name = "pane-down" }
k = { cmd = "select-pane -U", desc = "Focus the pane above", group = "pane", name = "pane-up" }
l = { cmd = "select-pane -R", desc = "Focus the pane to the right", group = "pane", name = "pane-right" }
H = { cmd = "resize-pane -L 5", desc = "Grow the pane leftwards, repeatable", group = "pane", name = "pane-wider-left", repeat = true }
J = { cmd = "resize-pane -D 3", desc = "Grow the pane downwards, repeatable", group = "pane", name = "pane-taller-down", repeat = true }
K = { cmd = "resize-pane -U 3", desc = "Grow the pane upwards, repeatable", group = "pane", name = "pane-taller-up", repeat = true }
L = { cmd = "resize-pane -R 5", desc = "Grow the pane rightwards, repeatable", group = "pane", name = "pane-wider-right", repeat = true }
C = { cmd = 'new-window -c "#{pane_current_path}"', desc = "A plain new window, in the directory this pane is in", group = "window", name = "window-new" }
c = { cmd = 'new-window -c "#{pane_current_path}" ; split-window -h -c "#{pane_current_path}" ; split-window -v -c "#{pane_current_path}" ; select-layout main-vertical ; select-pane -t 1', desc = "A new window in the cockpit layout: one full-height pane on the left, two stacked on the right", group = "window", name = "window-cockpit" }
V = { cmd = "select-layout main-vertical", desc = "Reshape this window into the cockpit layout", group = "window", name = "layout-cockpit" }
t = { cmd = "switch-client -l", desc = "The session you were in before this one", group = "session", name = "session-last" }
"(" = { cmd = "switch-client -p", desc = "Previous session, repeatable", group = "session", name = "session-prev", repeat = true }
")" = { cmd = "switch-client -n", desc = "Next session, repeatable", group = "session", name = "session-next", repeat = true }
# canopy-reload: grofe re-reads every layer with its own reload, which validates them all first and applies all or nothing.
r = { cmd = 'reload ; display-message "canopy: reloaded"', desc = "Re-read canopy's configuration, your user.conf included", group = "canopy", name = "canopy-reload" }
M-s = { cmd = 'run-shell "$CANOPY_STORE/plugins/strategies/canopy_save.sh"', desc = "Save every session now, without waiting for the next autosave", group = "session", name = "save-now" }
M-r = { cmd = 'run-shell "$CANOPY_STORE/plugins/tmux-resurrect/scripts/restore.sh"', desc = "Restore the last save over this server, replacing what is open", group = "session", name = "restore-now" }
