# Generated by `canopy grofe generate` from grofe/templates/30-canopy-plugins.toml.
# Do not edit: edit the template, or tmux/keys.tsv, and regenerate.

requires = "grofe >= 0.1"

# canopy's plugin layer, on grofe. The tmux layer this ports is
# tmux/conf.d/30-plugins.conf, and every setting here is that file's, with
# the reasoning left there rather than copied.
#
# Every vendored plugin runs on grofe unchanged, through the same loader the
# tmux layer calls: canopy_load_plugins in lib/plugins.sh, over the same
# names as tmux.conf, minus the two grofe does natively (below). Each runs as tmux ran it, through `tmux
# run-shell`, which grofe answers to the tmux name.
#
# Two of them do not load here. grofe snapshots, restores and resumes
# panes itself, so resurrect and continuum would be a second save loop and a
# second restore racing the first at server start (owner ruling 2026-11-05).
# The loader skips them, and the name it skips them by is
# @canopy_persistence below; their options stay set, so this file keeps
# mirroring 30-plugins.conf setting for setting. The key table's save-now
# (M-s) and restore-now (M-r) rows say grofe does it instead of calling
# resurrect's scripts.
#
# grofe runs load commands once the whole config is applied, at server start
# and again on every `reload`, as tmux ran a plugin's entry point from
# source-file, and layer by layer, so user.toml's own run after these. Every
# option below is set before any of them runs.
#
# opensessions and tmux-claude-session-manager are not in the loader list
# either: grofe has its own agent list and sidebar. The tmux layer still
# loads them. tmux-which-key does load: its grouped prefix Space menu is
# plain display-menu, which grofe draws as tmux does, and grofe's own key
# menu lists every binding rather than grouping the common ones.

load-commands = [
  # Which persistence this server got, the same answer 30-plugins.conf
  # computes from #{?grofe_version,grofe,resurrect} and keeps in the same
  # option; written plainly because this file loads on grofe and nowhere
  # else. First, because the loader below reads it to know which plugins to
  # leave dormant, and `canopy doctor` reads it to report which branch the
  # loaded config took. A load command rather than a [user-options] value:
  # it is canopy's own answer, not an option a user sets.
  'set-option -g @canopy_persistence "grofe"',
  # Where resurrect keeps its saves: canopy's own state directory. A load
  # command rather than a user option, because a [user-options] value is
  # taken as written and resurrect expands only $HOME and ~ itself; here
  # grofe expands $CANOPY_STATE from [environment] when the config loads.
  'set-option -g @resurrect-dir "$CANOPY_STATE/resurrect"',
  # Which saved commands resurrect may replay, generated from the installed
  # adapters, before resurrect loads.
  """if-shell '[ -x "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh" ]' 'run-shell "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh"'""",
  # The plugin loader, over the eight names in tmux.conf's order. It loads into
  # the server in $TMUX and no other. Then which-key's menu, titled "tmux"
  # in its prebuilt form, is retitled grofe, in the same shell so it runs
  # once which-key has bound it.
  '''run-shell 'f="$CANOPY_STORE/lib/plugins.sh"; [ -r "$f" ] || exit 0; . "$CANOPY_STORE/lib/env.sh"; . "$f"; canopy_load_plugins tmux-resurrect tmux-continuum tmux-sensible tmux-yank tmux-fzf tmux-sessionx tmux-which-key tmux-fzf-url; sh "$CANOPY_STORE/grofe/which-key-title.sh"'''',
  # tmux-sensible binds prefix R to `tmux source-file` of a tmux config, which
  # on grofe would load canopy's tmux.conf and rebind prefix r, among others,
  # to its tmux-dialect reload, a runtime binding grofe's own reload keeps. So
  # R is rebound after the loader to the same reload canopy's r key runs.
  'bind-key R { reload ; display-message "canopy: reloaded" }',
  # No save wrapper and no M-s rebind here, which is where the tmux layer
  # has both: neither resurrect nor continuum loads on grofe, so there is no
  # save loop to serialise, and the key table's own M-s says grofe saves by
  # itself. Rebinding it would take that back and write a resurrect save
  # grofe never reads.
]

[user-options]
# Restore the last save when the server starts.
continuum-restore = "on"
# Minutes between automatic saves.
continuum-save-interval = "5"
resurrect-strategy-nvim = "session"
# canopy's save strategy, as a path relative to resurrect's own strategies
# directory.
resurrect-save-command-strategy = "../../strategies/canopy_save_command"
# resurrect's own keys, moved off C-s and C-r before it loads, so it never
# takes canopy's prefix-send binding.
resurrect-save = "M-s"
resurrect-restore = "M-r"
# which-key loads its prebuilt default menu: its build imports a git
# submodule vendoring leaves out.
tmux-which-key-disable-autobuild = "1"
