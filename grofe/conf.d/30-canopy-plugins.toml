# Generated by `canopy grofe generate` from grofe/templates/30-canopy-plugins.toml.
# Do not edit: edit the template, or tmux/keys.tsv, and regenerate.

requires = "grofe >= 0.1"

# canopy's plugin layer, on grofe. The tmux layer this ports is
# tmux/conf.d/30-plugins.conf, and every setting here is that file's, with
# the reasoning left there rather than copied.
#
# Every vendored plugin runs on grofe unchanged, through the same loader the
# tmux layer calls: canopy_load_plugins in lib/plugins.sh, over the same ten
# names in the same order. Each runs as tmux ran it, through `tmux
# run-shell`, which grofe answers to the tmux name. tmux-resurrect and
# tmux-continuum are among them until grofe's own persistence imports their
# last save and replaces them; the key table's save-now (M-s) and
# restore-now (M-r) rows run resurrect's scripts.
#
# grofe runs load commands once the whole config is applied, at server start
# and again on every `reload`, as tmux ran a plugin's entry point from
# source-file, and layer by layer, so user.toml's own run after these. Every
# option below is set before any of them runs.

load-commands = [
  # Where resurrect keeps its saves: canopy's own state directory. A load
  # command rather than a user option, because a [user-options] value is
  # taken as written and resurrect expands only $HOME and ~ itself; here
  # grofe expands $CANOPY_STATE from [environment] when the config loads.
  'set-option -g @resurrect-dir "$CANOPY_STATE/resurrect"',
  # Which saved commands resurrect may replay, generated from the installed
  # adapters, before resurrect loads.
  """if-shell '[ -x "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh" ]' 'run-shell "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh"'""",
  # opensessions never downloads its binaries itself: canopy install puts
  # them in place (plugins/ARTIFACTS).
  "set-environment -g OPENSESSIONS_SKIP_BINARY_DOWNLOAD 1",
  # The plugin loader, over the ten names in tmux.conf's order. It loads into
  # the server in $TMUX and no other.
  '''run-shell 'f="$CANOPY_STORE/lib/plugins.sh"; [ -r "$f" ] || exit 0; . "$CANOPY_STORE/lib/env.sh"; . "$f"; canopy_load_plugins tmux-resurrect tmux-continuum tmux-sensible tmux-yank tmux-fzf tmux-sessionx tmux-which-key opensessions tmux-fzf-url tmux-claude-session-manager'''',
  # continuum's saves and the save-now key (M-s) go through canopy's
  # wrapper, one save at a time per server; after the loader, because
  # resurrect sets its own save.sh as both as it loads.
  'set-option -g @resurrect-save-script-path "$CANOPY_STORE/plugins/strategies/canopy_save.sh"',
  """bind-key M-s run-shell '"$CANOPY_STORE/plugins/strategies/canopy_save.sh"'""",
  # opensessions binds prefix C-s to its sidebar when it loads; this takes it
  # back for the key table's prefix-send row.
  "bind-key C-s send-prefix",
]

[user-options]
# Restore the last save when the server starts.
continuum-restore = "on"
# Minutes between automatic saves.
continuum-save-interval = "5"
resurrect-strategy-nvim = "session"
# canopy's save strategy, as a path relative to resurrect's own strategies
# directory.
resurrect-save-command-strategy = "../../strategies/canopy_save_command"
# resurrect's own keys, moved off C-s and C-r before it loads, so it never
# takes canopy's prefix-send binding.
resurrect-save = "M-s"
resurrect-restore = "M-r"
# tmux-which-key loads its prebuilt default menu, because its build needs a
# git submodule vendoring leaves out.
tmux-which-key-disable-autobuild = "1"
