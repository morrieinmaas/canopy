name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: shellcheck
        run: |
          set -eu
          targets=""
          for f in bin/* lib/*.sh; do
            [ -e "$f" ] && targets="$targets $f"
          done
          if [ -n "$targets" ]; then shellcheck $targets; fi
      - name: shfmt
        run: |
          set -eu
          dirs=""
          for d in bin lib; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -n "$dirs" ]; then shfmt -d -i 2 -ci $dirs; fi
      - run: bats test/
