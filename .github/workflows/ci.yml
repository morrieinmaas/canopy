name: CI

on:
  # Cheap enough to run on every push: it is the check most likely to
  # catch something, and it is the one whose answer is wanted fastest.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: lint
        run: sh test/lint.sh
      - run: bats test/
