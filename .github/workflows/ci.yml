name: CI

on:
  # Cheap enough to run on every push: it is the check most likely to
  # catch something, and it is the one whose answer is wanted fastest.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # mise-action installs the toolchain mise.toml pins, tmux included,
      # so the tests run against the same tmux on both runners.
      - uses: jdx/mise-action@v2
      # The task names, not the commands behind them. A contributor runs
      # `mise run lint` and `mise run test` and gets exactly this.
      - run: mise run lint
      - run: mise run test
