name: Restore proof

on:
  # Heavy: two OS runners, and for the smoke run two container images
  # built from scratch. Running that on every push to every branch
  # spends minutes to tell us what the same command told us locally a
  # moment earlier. It runs where the answer is load bearing, on main
  # and on a pull request, and on demand for anything else.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: restore-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-proof:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install tmux (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: install tmux (macos)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: sh test/restore-proof.sh
