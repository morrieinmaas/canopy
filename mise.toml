[tools]
bats = "latest"
# The Claude Code adapter's installer merges canopy's hooks into an
# existing settings.json with jq, and test/agent_report.bats exercises that
# merge. Pinned here so the suite is not quietly weaker on a machine that
# happens not to have jq.
jq = "latest"
# Pinned, not "latest": an unpinned shellcheck resolved to a stale
# version on a local machine while CI resolved a fresh one on every
# run, and the fresh one implemented a check the stale one did not.
# Bump this deliberately, run test/lint.sh, and commit the bump.
shellcheck = "0.11.0"
shfmt = "latest"
tmux = "latest"
