# canopy's navigator layer: vim-tmux-navigator's tmux side.
#
# C-h, C-j, C-k and C-l move between panes and Neovim's windows alike, and
# C-\ goes to the last pane. These are the bindings the plugin's own tmux
# script makes by default, written out here rather than vendored: that
# script is these lines and nothing else, and a vendored tree would add a
# VERSIONS line, checksums, a doctor row and an artifact check to carry
# them. Neovim's half of the plugin lives in the user's nvim config and is
# not canopy's. grofe/templates/40-canopy-nav.toml is this layer for grofe;
# test/nav.bats holds the two to the same keys.
#
# These are hand-written `bind` lines, an exception to "keys are data" in
# tmux/keys.tsv: that table cannot name the root and copy-mode-vi tables
# with a per-key shell condition. The grofe side is hand-written for the
# same reason.
#
# When a process on the pane's tty is Neovim, Vim or fzf (the plugin's
# default pattern, matched on the process name, ignoring case and ignoring
# stopped or dead processes), the key is sent to the pane and Neovim's half
# of the plugin moves between its own windows. Otherwise the key moves
# focus. The check forks `ps` and `grep` per keypress, as upstream does;
# grofe answers it from a format conditional instead. `([^ ]*/)?` stands in
# for upstream's `(\S+\/)?`, which BSD grep does not read.
#
# While the window is zoomed, select-pane unzooms it and moves. Set the
# plugin's option @tmux_navigator_disable_when_zoomed to 1 to keep the focus
# where it is instead. It is read at each keypress.
#
# The plugin's @vim_navigator_mapping_* and @vim_navigator_pattern options
# are not read: the keys and the pattern are the plugin's defaults.

bind-key -n C-h if-shell "ps -o state= -o comm= -t '#{s|/dev/||:pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-h" "if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -L'"
bind-key -n C-j if-shell "ps -o state= -o comm= -t '#{s|/dev/||:pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-j" "if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -D'"
bind-key -n C-k if-shell "ps -o state= -o comm= -t '#{s|/dev/||:pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-k" "if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -U'"
bind-key -n C-l if-shell "ps -o state= -o comm= -t '#{s|/dev/||:pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys C-l" "if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -R'"
bind-key -n 'C-\' if-shell "ps -o state= -o comm= -t '#{s|/dev/||:pane_tty}' | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'" "send-keys 'C-\\'" "if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -l'"

# C-l no longer reaches a shell, so the plugin gives clearing the screen to
# the prefix.
bind-key C-l send-keys C-l

# The plugin's copy-mode-vi rows.
bind-key -T copy-mode-vi C-h if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -L'
bind-key -T copy-mode-vi C-j if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -D'
bind-key -T copy-mode-vi C-k if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -U'
bind-key -T copy-mode-vi C-l if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'C-\' if-shell -F '#{&&:#{window_zoomed_flag},#{==:#{@tmux_navigator_disable_when_zoomed},1}}' '' 'select-pane -l'
