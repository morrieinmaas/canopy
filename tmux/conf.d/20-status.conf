# canopy's status line.
#
# Two rules shape everything here, both from the spec.
#
# Nothing in a render path may fork. Every token below is a pure `#{...}`
# that tmux resolves itself, except one `#()` aggregator that renders the
# right-hand segments in a single process. Four segments as four `#()`
# calls would be four processes every status-interval, forever, on every
# machine.
#
# Colour is data. Every colour is read from an @theme_* option rather than
# written in, so a theme can repaint the bar by setting options and
# nothing has to re-source anything. The defaults below are a light
# palette; M5's theme layer overwrites them.
#
# Load order matters more than it looks. This layer is 20, so it runs
# before 30-plugins, and that is load bearing: tmux-continuum PREPENDS its
# autosave hook to whatever status-right holds when it loads. Set
# status-right after the plugin layer and that hook is gone, and autosave
# silently stops. A user.conf that wants its own segments should append:
#
#     set -ag status-right "#(~/.config/tmux/my-segment.sh)"
#
# `canopy doctor` checks for the hook, because losing it costs a
# conversation and says nothing.

# --- palette ---------------------------------------------------------------
set -g @theme_bg     "#fbf1c7"
set -g @theme_fg     "#3c3836"
set -g @theme_blue   "#458588"
set -g @theme_yellow "#b57614"
set -g @theme_green  "#79740e"
set -g @theme_grey   "#a89984"
set -g @theme_muted  "#7c6f64"
# Not repainted by a theme: a warning colour that changes with the theme
# is a warning colour somebody has to learn twice.
set -g @theme_red    "#cc241d"

# --- pill caps -------------------------------------------------------------
# The rounded caps are nerd-font half circles, U+E0B6 and U+E0B4, written
# here as literal bytes.
#
# They were built from codepoints through `run-shell` at first, to keep
# every byte in this file ASCII so that no editor, formatter or tool could
# silently strip a glyph. That cost far more than it bought: a `run-shell`
# anywhere in a layer passes through tmux's command queue and resets the
# status of the source-file that is running it, so every configuration
# error in every LATER layer stops being reported. canopy_tmux_validate,
# which is the check `canopy install` and `canopy doctor` both rely on,
# went green on a config holding a syntax error. One status bar
# decoration is not worth blinding the one check that matters.
#
# The original worry is real, so it is a test instead: test/status.bats
# asserts both glyphs are byte-for-byte intact, and CI fails if anything
# strips or mangles them.
#
# A machine without a nerd font sets these to empty in user.conf, and
# every segment renders as plain text with no caps.
set -g @pill_l ""
set -g @pill_r ""

# --- segment switches ------------------------------------------------------
# Read by the aggregator. Unset means on.
set -g @canopy_status_battery on
set -g @canopy_status_net on

# --- shape -----------------------------------------------------------------
# Two rows: the pills on top, an empty second row beneath them, so
# terminal content does not butt against the bar.
set -g status 2
set -g status-format[1] ""
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#{@theme_fg}"

# --- left: the session -----------------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=#{@theme_blue},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_blue},bold] #S #[fg=#{@theme_blue},bg=default,nobold]#{@pill_r} "

# --- windows ---------------------------------------------------------------
# #{b:pane_current_path} rather than the window name, matching what
# 00-core's automatic-rename-format puts there, so a window reads the same
# whether or not it has been renamed by hand.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@theme_grey},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_grey}] #I #W #[fg=#{@theme_grey},bg=default]#{@pill_r} "
set -g window-status-current-format "#[fg=#{@theme_yellow},bg=default]#{@pill_l}#[fg=#{@theme_bg},bg=#{@theme_yellow},bold] #I #W#{?window_zoomed_flag, +,} #[fg=#{@theme_yellow},bg=default,nobold]#{@pill_r} "

# --- right: the one aggregator ---------------------------------------------
# $CANOPY_STORE is expanded by the shell tmux runs this in, from the
# server's environment, which the installed entry point populates.
set -g status-right-length 120
set -g status-right "#($CANOPY_STORE/bin/canopy-status)"
