# canopy plugin layer: the vendored session-persistence plugins.
#
# tmux-resurrect saves and restores the session tree; tmux-continuum runs
# resurrect's save on a timer and restores once at server start. Together
# they are what makes a reboot return a pane to where it was, which is the
# whole reason this milestone exists.
#
# Both are loaded by absolute path out of the store. No plugin manager, no
# `set -g @plugin`, no clone at first run: the trees are vendored under
# plugins/ at the commits recorded in plugins/VERSIONS, so what loads here
# is bytes that shipped with this checkout and nothing a network can change
# underneath it.
#
# $CANOPY_STORE is expanded by tmux from the server's own environment, the
# same way the entry point expands it for the rest of conf.d. A checkout
# that sources this file directly supplies it from the caller's
# environment instead.
#
# Why each load is guarded by if-shell rather than run-shell alone:
# run-shell reports a failed command back to source-file, and source-file
# fails the whole config load. Unguarded, two ordinary situations would
# stop a user's tmux from loading *anything*:
#
#   1. No bash. Both plugins are upstream bash scripts, and a BusyBox or
#      other minimal userland has no bash at all. canopy is tested on
#      Alpine precisely because that userland is real.
#   2. No plugins/ tree. A partial checkout, or a store copied without it.
#
# Losing persistence is bad. Losing the entire tmux configuration because
# persistence is unavailable is worse, and it is worse in exactly the
# situation where the user can least afford it. So the layer goes dormant,
# and `canopy doctor` names both conditions with a reason, which is the
# same contract every other optional layer in canopy already has.
# Where resurrect keeps its saves. Upstream's default is
# ~/.local/share/tmux/resurrect, which is outside every tree canopy
# reasons about: restore could not promise anything about it and uninstall
# could not say where it went. The saves ARE the data persistence depends
# on, so they live in canopy's own state directory with the capability
# fragment and the restore points.
#
# $CANOPY_STATE is expanded by tmux from the server's environment, which
# the installed entry point populates with a `set-environment -g` line.
# resurrect creates the directory itself on its first save.
#
# A machine that already has saves at the upstream default keeps them
# there; they are not migrated, and the first save after this lands writes
# a fresh one here.
set -g @resurrect-dir "$CANOPY_STATE/resurrect"

# Whether continuum replays the save file when the server starts.
#
# continuum's own default is off, and off is the whole milestone being
# inert: the save strategy, the resume templates, the process list and the
# stagger all exist to write a save file that, at upstream's default,
# nothing ever reads back. A stock canopy install restored nothing at all
# after a reboot, while `canopy reboot-check` reported per-pane optimism
# about panes nothing would bring back.
#
# Set here rather than left to the user, because the product promise is
# that a reboot returns a pane to its conversation, and an opt-in for the
# one option that makes that happen is not a promise. It is a load-bearing
# setting: `canopy doctor` asserts it, and `canopy reboot-check` refuses to
# answer per pane while it is off.
#
# continuum reads it in a background script a second after the server
# starts, and only when the server started within
# @continuum-restore-max-delay seconds, so this arms the boot case and
# nothing else. It also refuses while a second tmux server is running,
# which is why reboot-check says so when it sees one.
set -g @continuum-restore on

# How often continuum writes a save.
#
# continuum's own default is fifteen minutes. Five, because the interval is
# exactly the window in which a reboot loses a conversation: a pane opened
# after the last save is not in it, and `canopy reboot-check` can only
# report what the file holds, so at fifteen minutes it truthfully reports
# a twelve minute old pane as "not saved yet", which is correct and
# useless. A save is one file write of a few hundred bytes.
#
# It rides on a status line redraw, so a server nothing is attached to may
# miss ticks. reboot-check allows two before it calls the timer stopped.
set -g @continuum-save-interval '5'

# What resurrect asks nvim to do when it saves a pane running it.
#
# `session` has nvim write its own session file and read it back, which is
# the difference between a pane that returns to the editor and a pane that
# returns to the editor holding the buffers, splits and cursor positions it
# had. That is the same claim this milestone makes for an agent pane, made
# for the other program a pane is most likely to be holding, and it costs
# one option.
set -g @resurrect-strategy-nvim 'session'

# What resurrect records as each pane's command when it saves.
#
# resurrect asks a save-command strategy for that line, and builds the path
# to the strategy out of this option and nothing else:
#
#   <resurrect's own tree>/save_command_strategies/<this option>.sh
#
# So an absolute path cannot be named here, and canopy's strategy is not in
# resurrect's tree to be named directly: a vendored tree holds bytes that
# came from upstream and nothing else, which is what lets `canopy doctor`
# tell "present" from "modified", and a canopy file inside it would make
# every tree modified by definition. Hence a relative value that climbs back
# out to plugins/strategies/, beside the vendored trees rather than inside
# one.
#
# Measured on the pinned commit rather than assumed, because both halves
# matter. resurrect interpolates this option into that path without
# sanitising it, so a relative value does resolve, which is why canopy needs
# no patch against the vendored tree. And it checks the resulting file
# exists, falling back to its own `ps` strategy when it does not, which is
# why a value that ever stops resolving costs the agent rewrite rather than
# the whole save. test/save_strategy.bats builds this path by hand and runs
# a real save through resurrect, so a pin that changes either half fails
# there rather than on somebody's machine after a reboot.
set -g @resurrect-save-command-strategy "../../strategies/canopy_save_command"

# Which saved commands resurrect is allowed to replay.
#
# resurrect types a pane's saved command back into the restored pane only
# when that command matches @resurrect-processes, and its default list
# names editors and pagers, nothing else. So a saved resume command that
# is not on this list is a command that never runs: the pane comes back as
# a bare shell and the conversation is gone.
#
# The list is generated rather than written out here, because an adapter
# is a file on disk that a user adds, not a name canopy knows in advance.
# Installing an adapter is what makes its panes restorable, and a machine
# with no adapters gets an empty value, which leaves resurrect's own
# defaults exactly as they were.
#
# Set before the two plugins load: continuum's restore fires seconds after
# the server starts, and an option set after that would be set too late.
if-shell '[ -x "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh" ]' \
  'run-shell "$CANOPY_STORE/plugins/strategies/canopy_restore_processes.sh"'

if-shell 'command -v bash >/dev/null 2>&1 && [ -x "$CANOPY_STORE/plugins/tmux-resurrect/resurrect.tmux" ]' \
  'run-shell "$CANOPY_STORE/plugins/tmux-resurrect/resurrect.tmux"'
if-shell 'command -v bash >/dev/null 2>&1 && [ -x "$CANOPY_STORE/plugins/tmux-continuum/continuum.tmux" ]' \
  'run-shell "$CANOPY_STORE/plugins/tmux-continuum/continuum.tmux"'
