# canopy plugin layer: the vendored session-persistence plugins.
#
# tmux-resurrect saves and restores the session tree; tmux-continuum runs
# resurrect's save on a timer and restores once at server start. Together
# they are what makes a reboot return a pane to where it was, which is the
# whole reason this milestone exists.
#
# Both are loaded by absolute path out of the store. No plugin manager, no
# `set -g @plugin`, no clone at first run: the trees are vendored under
# plugins/ at the commits recorded in plugins/VERSIONS, so what loads here
# is bytes that shipped with this checkout and nothing a network can change
# underneath it.
#
# $CANOPY_STORE is expanded by tmux from the server's own environment, the
# same way the entry point expands it for the rest of conf.d. A checkout
# that sources this file directly supplies it from the caller's
# environment instead.
#
# Why each load is guarded by if-shell rather than run-shell alone:
# run-shell reports a failed command back to source-file, and source-file
# fails the whole config load. Unguarded, two ordinary situations would
# stop a user's tmux from loading *anything*:
#
#   1. No bash. Both plugins are upstream bash scripts, and a BusyBox or
#      other minimal userland has no bash at all. canopy is tested on
#      Alpine precisely because that userland is real.
#   2. No plugins/ tree. A partial checkout, or a store copied without it.
#
# Losing persistence is bad. Losing the entire tmux configuration because
# persistence is unavailable is worse, and it is worse in exactly the
# situation where the user can least afford it. So the layer goes dormant,
# and `canopy doctor` names both conditions with a reason, which is the
# same contract every other optional layer in canopy already has.
if-shell 'command -v bash >/dev/null 2>&1 && [ -x "$CANOPY_STORE/plugins/tmux-resurrect/resurrect.tmux" ]' \
  'run-shell "$CANOPY_STORE/plugins/tmux-resurrect/resurrect.tmux"'
if-shell 'command -v bash >/dev/null 2>&1 && [ -x "$CANOPY_STORE/plugins/tmux-continuum/continuum.tmux" ]' \
  'run-shell "$CANOPY_STORE/plugins/tmux-continuum/continuum.tmux"'
