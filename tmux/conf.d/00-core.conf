# canopy tmux core defaults.
#
# Deliberately small. @canopy_test_marker carries no behaviour of its own;
# it exists purely so tests can prove user.conf is sourced after this file
# and wins, without asserting on opinionated defaults that will churn.
set -g @canopy_test_marker shipped-default

# The prefix, which spec 4.2 gives to this layer rather than to the key
# table, because it is an option and not a binding.
#
# C-b is tmux's default and is also the terminal's own "back one
# character", so it costs a keystroke in every readline buffer. C-s is
# adjacent to the home row, and the thing it shadows, terminal flow
# control, has not been wanted since hardware terminals. `prefix C-s`
# sends it through to a nested tmux or an app that wants it, which is the
# prefix-send row in the key table.
#
# To keep C-b instead, in $CANOPY_CONFIG/user.conf:
#   set -g prefix C-b
#   unbind C-s
#   bind C-b send-prefix
unbind C-b
set -g prefix C-s

set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# --- terminal ---------------------------------------------------------------

# Everything from here to the end of the terminal block appends rather
# than sets, and appending twice appends twice: `prefix r` re-sources this
# file, so after three reloads terminal-features held the same four
# entries three times over and update-environment held TERM six times.
# Harmless to tmux, which merges them, and it makes `show -gv
# terminal-features` unreadable and grows without bound across a session.
#
# The guard is an option this file sets at the end of the block, so the
# appending lines run once per server and a reload re-reads everything
# else. %if is the config parser's own conditional: no fork, and none of
# if-shell's habit of resetting the status of the file being sourced.
%if "#{==:#{@canopy_core_appended},}"

# Truecolor, declared per terminal rather than globally, because
# terminal-features is how tmux learns what the OUTER terminal can do.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Let a program's own escape sequences reach the terminal. Inline images
# arrive as kitty graphics sequences; without this tmux eats them and the
# program falls back to pixelated half blocks, which reads as that
# program's bug rather than as a tmux setting.
set -g allow-passthrough on

# Extended keys, always, in CSI-u.
#
# This is the setting that decides whether keys work at all inside nvim,
# helix and a coding agent, and the reasoning is not obvious enough to
# leave unwritten. Those programs request the kitty keyboard protocol.
# tmux forwards extended keys only for its OWN request method and ignores
# theirs, so `extended-keys on`, which means forward-on-demand, never
# triggers: keys as ordinary as a bare `q` to quit a TUI silently do
# nothing. Sending them unconditionally, in the CSI-u form those programs
# actually read, is the fix.
#
# The tradeoff, honestly: with `always`, macOS option-as-alt misbehaves in
# some ghostty builds. If Alt or M- keys act up, this line is why. A
# change here needs a fresh client, so detach and reattach, or restart the
# server.
set -g extended-keys always
# extended-keys-format arrived in tmux 3.5, and canopy's floor is 3.4, so
# an unguarded line here is an "invalid option" on every 3.4 machine,
# which is what Ubuntu still ships. It failed exactly one job: the bats
# suite gets its tmux from mise and never saw it, while the restore proof
# uses the system tmux and did.
#
# Guarded with tmux's own %if rather than if-shell on purpose. if-shell
# passes through the command queue and resets the status of the
# source-file running it, which hides errors in every later layer;
# %if is evaluated by the config parser and forks nothing.
#
# The comparison is numeric, so 3.4 is below 3.5 and 3.5a and 3.7b are
# above it. It will read 3.10 as below 3.5 when tmux gets there.
%if "#{>=:#{version},3.5}"
set -g extended-keys-format csi-u
%endif
set -as terminal-features "xterm*:extkeys"

# Pass the real terminal through, so a program's capability detection sees
# what it is actually running in.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @canopy_core_appended 1
%endif

# --- windows ----------------------------------------------------------------

# A window is named for the directory it is in, and stays that way.
#
# Both lines are one decision. automatic-rename on its own loses to any
# shell prompt that sets the terminal title, which is most of them: tmux
# reads the OSC title as a manual rename and stops auto-renaming that
# window for good. allow-rename off is what makes the format hold. A
# deliberate `prefix ,` rename still sticks.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off
