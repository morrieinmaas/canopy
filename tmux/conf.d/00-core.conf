# canopy tmux core defaults.
#
# Deliberately small. @canopy_test_marker carries no behaviour of its own;
# it exists purely so tests can prove user.conf is sourced after this file
# and wins, without asserting on opinionated defaults that will churn.
set -g @canopy_test_marker shipped-default

set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# --- terminal ---------------------------------------------------------------

# Truecolor, declared per terminal rather than globally, because
# terminal-features is how tmux learns what the OUTER terminal can do.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Let a program's own escape sequences reach the terminal. Inline images
# arrive as kitty graphics sequences; without this tmux eats them and the
# program falls back to pixelated half blocks, which reads as that
# program's bug rather than as a tmux setting.
set -g allow-passthrough on

# Extended keys, always, in CSI-u.
#
# This is the setting that decides whether keys work at all inside nvim,
# helix and a coding agent, and the reasoning is not obvious enough to
# leave unwritten. Those programs request the kitty keyboard protocol.
# tmux forwards extended keys only for its OWN request method and ignores
# theirs, so `extended-keys on`, which means forward-on-demand, never
# triggers: keys as ordinary as a bare `q` to quit a TUI silently do
# nothing. Sending them unconditionally, in the CSI-u form those programs
# actually read, is the fix.
#
# The tradeoff, honestly: with `always`, macOS option-as-alt misbehaves in
# some ghostty builds. If Alt or M- keys act up, this line is why. A
# change here needs a fresh client, so detach and reattach, or restart the
# server.
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# Pass the real terminal through, so a program's capability detection sees
# what it is actually running in.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- windows ----------------------------------------------------------------

# A window is named for the directory it is in, and stays that way.
#
# Both lines are one decision. automatic-rename on its own loses to any
# shell prompt that sets the terminal title, which is most of them: tmux
# reads the OSC title as a manual rename and stops auto-renaming that
# window for good. allow-rename off is what makes the format hold. A
# deliberate `prefix ,` rename still sticks.
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off
