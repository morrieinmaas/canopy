# canopy tmux entry point.
#
# Load order:
#   1. conf.d/00-core.conf: small, deliberately opinionated core.
#   2. $CANOPY_STATE/05-caps.conf: capability flags generated by
#      `canopy caps`. Sourced from state, not the store, because the store
#      is read-only by convention; sourced with -q so a machine that has
#      not yet run the probe still loads cleanly. Sourced immediately
#      after 00-core and before every other layer, so that a layer
#      guarding on a capability (@canopy_has_*) sees it set.
#   3. $CANOPY_STATE/10-keys.conf: the key layer generated by `canopy keys`
#      from tmux/keys.tsv. From state for the same reason as 05-caps, and
#      sourced here so that its numeric place in the layer table is kept:
#      after caps, before every layer numbered 20 and up.
#   4. conf.d/[1-9]*.conf layers (glob, sorted): numbered 10/20/30/40/50/60
#      per the layer table. The glob deliberately excludes 00-core.conf
#      (already sourced in step 1) and would-be 0x-prefixed files: unlike
#      00-core's plain `set -g` options, later layers use appending forms
#      (`set -as terminal-features`, `set -ga`) that a second source would
#      silently duplicate. Sourced with -q: tmux errors on a glob with zero
#      matches, and M1 ships no numbered layer yet.
#   5. $CANOPY_CONFIG/user.conf, if present: sourced after the layers so
#      it wins.
#   6. The vendored plugins, through canopy_load_plugins in lib/plugins.sh,
#      after user.conf as TPM ran after it, so a plugin reads the options
#      user.conf sets for it. Then prefix C-s back to send-prefix, which
#      opensessions takes when it loads.
#
# Paths are expanded from the environment ($CANOPY_STORE, $CANOPY_STATE,
# $CANOPY_CONFIG) rather than written as bare relative paths: tmux resolves
# a relative source-file path against the server's working directory, not
# against this file's own directory, so a bare "conf.d/*.conf" only works
# when tmux happens to be started with that directory as its cwd.
#
# Those three are read from the tmux SERVER's environment, which is not the
# environment of whoever ran tmux, and nothing outside tmux populates it.
# The installed entry point is what puts them there: `canopy install`
# writes a stub carrying absolute literals plus a `set-environment -g` line
# for each of the three, then sources this file. This file is therefore
# sourced by something that has already set them, never on its own; a
# checkout that runs it directly (the test suite, a developer) supplies
# them from its own environment instead.

source-file "$CANOPY_STORE/tmux/conf.d/00-core.conf"
source-file -q "$CANOPY_STATE/05-caps.conf"
source-file -q "$CANOPY_STATE/10-keys.conf"
source-file -q "$CANOPY_STORE/tmux/conf.d/[1-9]*.conf"
source-file -q "$CANOPY_CONFIG/user.conf"

# Every vendored plugin, in this order: for each name, an executable *.tmux
# entry point in plugins/<name> (and bash, when its first line asks for
# bash), run through run-shell on this server. A plugin that cannot load is
# skipped with one line in $CANOPY_STATE/plugins.log and nothing on the
# status line, and the rest still load; `canopy doctor` shows the log. A
# store without lib/plugins.sh loads nothing and fails nothing, because the
# run-shell exits 0 before it gets that far. 30-plugins.conf sets every
# plugin option canopy ships before this runs.
#
# resurrect and continuum come first: continuum's restore reads
# @resurrect-processes, which 30-plugins.conf sets, seconds after it loads.
# The list is the names in plugins/VERSIONS, in its order;
# test/plugin_loader.bats holds this line, the grofe fragment's and that
# file to each other.
run-shell 'f="$CANOPY_STORE/lib/plugins.sh"; [ -r "$f" ] || exit 0; . "$CANOPY_STORE/lib/env.sh"; . "$f"; canopy_load_plugins \
  tmux-resurrect tmux-continuum tmux-sensible tmux-yank tmux-fzf tmux-sessionx \
  tmux-which-key opensessions tmux-fzf-url tmux-claude-session-manager'

# prefix C-s is the key table's prefix-send row. opensessions binds it to
# its sidebar when it loads; prefix o s still reaches the sidebar.
bind-key C-s send-prefix
