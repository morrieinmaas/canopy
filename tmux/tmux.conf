# canopy tmux entry point.
#
# Load order:
#   1. conf.d/00-core.conf     — small, deliberately opinionated core.
#   2. $CANOPY_STATE/05-caps.conf — capability flags generated by
#      `canopy caps`. Sourced from state, not the store, because the store
#      is read-only by convention; sourced with -q so a machine that has
#      not yet run the probe still loads cleanly. Sourced immediately
#      after 00-core and before every other layer, so that a layer
#      guarding on a capability (@canopy_has_*) sees it set.
#   3. Every conf.d/*.conf layer (glob, sorted) — this re-sources
#      00-core.conf, which is harmless: every option it sets is an
#      idempotent `set -g`.
#   4. $CANOPY_CONFIG/user.conf, if present — sourced last so it wins.
#
# Paths are expanded from the environment ($CANOPY_STORE, $CANOPY_STATE,
# $CANOPY_CONFIG) rather than written as bare relative paths: tmux resolves
# a relative source-file path against the server's working directory, not
# against this file's own directory, so a bare "conf.d/*.conf" only works
# when tmux happens to be started with that directory as its cwd.

source-file "$CANOPY_STORE/tmux/conf.d/00-core.conf"
source-file -q "$CANOPY_STATE/05-caps.conf"
source-file "$CANOPY_STORE/tmux/conf.d/*.conf"
source-file -q "$CANOPY_CONFIG/user.conf"
