# canopy's which-key menu (prefix Space): the menu tmux-which-key ships
# prebuilt, with what is broken in it replaced.
#
# plugins/tmux-which-key is vendored verbatim and its autobuild is off
# (30-plugins.conf), so on its first load it copies plugin/init.example.tmux
# to plugin/init.tmux and sources that. This file is sourced by the plugin
# loader (canopy_load_plugins, lib/plugins.sh) straight after which-key has
# loaded, on tmux, and on grofe only when it runs as tmux on canopy's
# tmux.conf stub (the grofe tree does not load which-key), and it overwrites the menus and
# command aliases that file set, and unsets the restart-pane alias, which no
# menu item runs. It is sourced again on every reload, so a reload puts it
# back. Nothing is edited in the vendored tree.
#
# Commands are written with their full names, never tmux's short aliases
# (select-layout, not selectl), so that tmux and grofe-as-tmux parse the same menu.
# test/which_key.bats parses every item through tmux.
#
# What differs from upstream's menu:
#   - Layout / Tiled ran "selectnl tiled", which is no command.
#   - Client / Plugins ran TPM's scripts. canopy loads its vendored plugins
#     itself and installs no TPM, so the submenu is gone.
#   - Client / Reload config sourced $HOME/.tmux.conf. It now reloads
#     canopy, as prefix r does: canopy's tmux.conf on tmux, grofe's own
#     reload on grofe running as tmux.
#   - Windows / Rename and Sessions / Rename lost a level of quoting, so a
#     name with a space in it was refused.
#   - Space was still bound to upstream's menu, which tmux had expanded when
#     it bound the key, so it is bound again after the root menu is.
#   - Panes / Respawn pane expanded #{pane_current_path} once, at load, and
#     killed the running process without asking. It expands when it runs
#     and confirms first. Upstream's restart-pane alias, which baked that
#     directory in the same way, is unset.
#   - Keys is not a submenu, so it has no + marker, and Copy is one, so it
#     has.
#
# A which-key pin that adds a menu item is not picked up in the menus below:
# add it here too.

set -g @wk_menu_copy \
'Copy "c" copy-mode \
"List buffers" "#" list-buffers'

set -g @wk_menu_layout \
'Next "l" "next-layout ; show-wk-menu #{@wk_menu_layout}" \
Tiled "t" "select-layout tiled" \
Horizontal "h" "select-layout even-horizontal" \
Vertical "v" "select-layout even-vertical" \
"Horizontal main" "H" "select-layout main-horizontal" \
"Vertical main" "V" "select-layout main-vertical"'

set -g @wk_menu_windows \
'Last "tab" last-window \
Choose "w" "choose-tree -Zw" \
Previous "p" previous-window \
Next "n" next-window \
New "c" "new-window -c #{pane_current_path}" \
"" \
"+Layout" "l" "show-wk-menu #{@wk_menu_layout}" \
"Split horizontal" "/" "split-window -h -c #{pane_current_path}" \
"Split vertical" "-" "split-window -v -c #{pane_current_path}" \
Rotate "o" "rotate-window ; show-wk-menu #{@wk_menu_windows}" \
"Rotate reverse" "O" "rotate-window -D ; show-wk-menu #{@wk_menu_windows}" \
"" \
Rename "R" "command-prompt -p \"Rename window:\" -I \"#W\" \"rename-window -- \\\"%%%\\\"\"" \
Kill "X" "confirm-before -p \"Kill window #W? (y/n)\" kill-window"'

set -g @wk_menu_resize \
'Left "h" "resize-pane -L ; show-wk-menu #{@wk_menu_resize}" \
Down "j" "resize-pane -D ; show-wk-menu #{@wk_menu_resize}" \
Up "k" "resize-pane -U ; show-wk-menu #{@wk_menu_resize}" \
Right "l" "resize-pane -R ; show-wk-menu #{@wk_menu_resize}" \
"Left more" "H" "resize-pane -L 10 ; show-wk-menu #{@wk_menu_resize}" \
"Down more" "J" "resize-pane -D 10 ; show-wk-menu #{@wk_menu_resize}" \
"Up more" "K" "resize-pane -U 10 ; show-wk-menu #{@wk_menu_resize}" \
"Right more" "L" "resize-pane -R 10 ; show-wk-menu #{@wk_menu_resize}"'

set -g @wk_menu_panes \
'Last "tab" last-pane \
Choose "p" "display-panes -d 0" \
"" \
Left "h" "select-pane -L" \
Down "j" "select-pane -D" \
Up "k" "select-pane -U" \
Right "l" "select-pane -R" \
"" \
Zoom "z" "resize-pane -Z" \
"+Resize" "r" "show-wk-menu #{@wk_menu_resize}" \
"Swap left" "H" "swap-pane -t \"{left-of}\"" \
"Swap down" "J" "swap-pane -t \"{down-of}\"" \
"Swap up" "K" "swap-pane -t \"{up-of}\"" \
"Swap right" "L" "swap-pane -t \"{right-of}\"" \
Break "!" break-pane \
"" \
Mark "m" "select-pane -m" \
Unmark "M" "select-pane -M" \
Capture "C" capture-pane \
"Respawn pane" "R" "confirm-before -p \"Respawn pane #P, killing what runs in it? (y/n)\" \"respawn-pane -k -c \\\"#{pane_current_path}\\\"\"" \
Kill "X" "confirm-before -p \"Kill pane #P? (y/n)\" kill-pane"'

set -g @wk_menu_buffers \
'Choose "b" "choose-buffer -Z" \
List "l" list-buffers \
Paste "p" paste-buffer'

set -g @wk_menu_sessions \
'Choose "s" "choose-tree -Zs" \
New "N" new-session \
Rename "r" "command-prompt -p \"Rename session:\" -I \"#S\" \"rename-session -- \\\"%%%\\\"\""'

set -g @wk_menu_client \
'Choose "c" "choose-client -Z" \
Last "l" "switch-client -l" \
Previous "p" "switch-client -p" \
Next "n" "switch-client -n" \
"" \
Refresh "R" refresh-client \
Detach "D" detach-client \
Suspend "Z" suspend-client \
"" \
"Reload config" "r" reload-config \
Customize "," "customize-mode -Z"'

set -g @wk_menu_root \
'Run "space" command-prompt \
"Last window" "tab" last-window \
"Last pane" "`" last-pane \
"+Copy" "c" "show-wk-menu #{@wk_menu_copy}" \
"" \
"+Windows" "w" "show-wk-menu #{@wk_menu_windows}" \
"+Panes" "p" "show-wk-menu #{@wk_menu_panes}" \
"+Buffers" "b" "show-wk-menu #{@wk_menu_buffers}" \
"+Sessions" "s" "show-wk-menu #{@wk_menu_sessions}" \
"+Client" "C" "show-wk-menu #{@wk_menu_client}" \
"" \
Time "T" clock-mode \
"Show messages" "\~" show-messages \
Keys "?" "list-keys -N"'

# The Plugins submenu is gone with its only entry point.
set -gu @wk_menu_plugins

# upstream builds the root menu into this alias once, at load, so it has to
# be built again from the root menu above. Space runs it, and tmux expands an
# alias when a key is bound, not when it is pressed, so the binding upstream
# made from the old alias is made again here. This is
# which-key's own binding, not one of canopy's keys, so it is not in keys.tsv.
set -gF command-alias[201] \
'show-wk-menu-root=#{@wk_cmd_show} #{@wk_menu_root}'
bind-key -T prefix Space show-wk-menu-root

# upstream's alias 202 is reload-config. Plain
# `set -g`, not -gF: the formats and $CANOPY_STORE in the value are expanded
# when the alias runs, where upstream's -gF expanded them once at load, in
# whatever pane was current then.
#
# Reload config is chosen per server, here, so neither server parses a
# command it does not have: the item runs in tmux's dialect on both (grofe
# only as tmux on the stub), where
# `reload` is grofe's own command and no tmux command. On tmux it sources
# canopy's tmux.conf, as prefix r does. On grofe it runs grofe's reload as a
# shell command, through the binary behind the `tmux` the server put on the
# job's PATH, since grofe's own verbs exist only under its own name.
%if "#{grofe_version}"
set -g command-alias[202] \
'reload-config=run-shell "\"$(readlink -f \"$(command -v tmux)\")\" reload 2>&1 && tmux display-message \"canopy: reloaded\""'
%else
set -g command-alias[202] \
'reload-config=source-file "$CANOPY_STORE/tmux/tmux.conf" ; \
display-message "canopy: reloaded"'
%endif

# upstream's alias 203 is restart-pane, set with -gF at load, so the directory
# of whatever pane was current then is in it for good. Nothing uses it: the
# Respawn pane item above runs respawn-pane itself.
set -gu command-alias[203]
